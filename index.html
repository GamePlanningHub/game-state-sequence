<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10. 상태와 시퀀스</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
    --bg-void: #08090d;
    --bg-surface: #0e1019;
    --bg-elevated: #141722;
    --bg-card: #181c2a;
    --bg-glass: rgba(20, 23, 34, 0.75);
    --border-subtle: rgba(255,255,255,0.04);
    --border-dim: rgba(255,255,255,0.08);
    --border-accent: rgba(129,140,248,0.3);
    --text-primary: #eaedf3;
    --text-secondary: #8b95a8;
    --text-muted: #5a6478;
    --accent: #818cf8;
    --accent-glow: rgba(129,140,248,0.15);
    --accent-bright: #a5b4fc;
    --gold: #f0c040;
    --gold-dim: rgba(240,192,64,0.12);
    --green: #6ee7a0;
    --green-dim: rgba(110,231,160,0.1);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.1);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg-void);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

/* 배경 그라디언트 앰비언트 */
body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(129,140,248,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(240,192,64,0.03) 0%, transparent 50%);
}

/* ========== 오디오 바 (Glass Morphism) ========== */
#audio-bar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg-glass);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid var(--border-subtle);
    padding: 14px 24px;
}
#audio-controls {
    display: flex; align-items: center; gap: 14px;
    max-width: 860px; margin: 0 auto;
}
#play-btn {
    background: var(--accent);
    border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px var(--accent-glow), 0 2px 8px rgba(0,0,0,0.3);
    transition: var(--transition);
    flex-shrink: 0;
}
#play-btn svg { display: block; }
#play-btn:hover {
    background: var(--accent-bright);
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(129,140,248,0.3), 0 4px 12px rgba(0,0,0,0.4);
}
.skip-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
}
.skip-btn svg { display: block; }
.skip-btn:hover {
    background: var(--surface-hover);
    color: var(--text-primary);
}
#time-display {
    color: var(--text-muted); font-size: 12px;
    min-width: 90px; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.5px;
}

/* 커스텀 시크바 */
#seek-bar {
    flex: 1; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: var(--border-dim);
    border-radius: 2px; outline: none;
    cursor: pointer; transition: height 0.15s ease;
}
#seek-bar:hover { height: 6px; }
#seek-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
    cursor: pointer;
    transition: var(--transition);
}
#seek-bar::-webkit-slider-thumb:hover {
    transform: scale(1.3);
    box-shadow: 0 0 16px rgba(129,140,248,0.4);
}
#seek-bar::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%; border: none;
    background: var(--accent);
    cursor: pointer;
}

#speed-select {
    background: var(--bg-elevated); color: var(--text-secondary);
    border: 1px solid var(--border-dim);
    border-radius: 6px; padding: 5px 10px;
    font-size: 11px; font-family: 'JetBrains Mono', monospace;
    cursor: pointer; outline: none;
    transition: var(--transition);
}
#speed-select:hover { border-color: var(--accent); }

/* ========== 슬라이드 네비게이션 ========== */
#slide-nav {
    display: flex; gap: 3px; padding: 12px 24px;
    overflow-x: auto; background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    justify-content: center; flex-wrap: wrap;
    scrollbar-width: none;
}
#slide-nav::-webkit-scrollbar { display: none; }

.nav-dot {
    width: 34px; height: 30px; border-radius: 6px;
    border: 1px solid transparent; cursor: pointer;
    font-size: 11px; font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
    position: relative;
}
.nav-dot.has-audio {
    background: rgba(129,140,248,0.08); color: var(--accent);
    border-color: rgba(129,140,248,0.12);
}
.nav-dot.no-audio {
    background: rgba(255,255,255,0.02); color: var(--text-muted);
    opacity: 0.5;
}
.nav-dot:hover {
    opacity: 1;
    transform: translateY(-1px);
    border-color: var(--accent);
}
.nav-dot.active {
    background: var(--accent); color: #fff;
    transform: translateY(-2px) scale(1.05); opacity: 1;
    box-shadow: 0 4px 16px var(--accent-glow);
    border-color: transparent;
}

/* 슬라이드 전환 애니메이션 */
@keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}
#slide-content {
    animation: slideIn 0.35s ease-out;
}

#slide-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
}
#slide-id {
    color: var(--accent); font-size: 11px; letter-spacing: 3px;
    font-weight: 500; text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
}
#slide-badge {
    font-size: 10px; padding: 3px 10px; border-radius: 20px;
    font-weight: 500; letter-spacing: 0.3px;
}
.badge-audio {
    background: var(--green-dim); color: var(--green);
    border: 1px solid rgba(110,231,160,0.15);
}
.badge-no-audio {
    background: var(--red-dim); color: var(--red);
    border: 1px solid rgba(248,113,113,0.12);
}

#slide-title {
    font-size: 26px; font-weight: 900; color: #fff;
    margin-bottom: 32px; line-height: 1.5;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-dim);
    letter-spacing: -0.3px;
}

/* ========== 슬라이드 콘텐츠 블록 ========== */

.slide-text {
    color: var(--text-secondary); font-size: 14.5px;
    line-height: 2; margin-bottom: 20px;
    font-weight: 300;
}
.slide-text strong {
    color: var(--gold); font-weight: 500;
    background: var(--gold-dim);
    padding: 1px 5px; border-radius: 3px;
}
.slide-text em {
    color: var(--accent-bright); font-style: normal; font-weight: 400;
}

/* 인용 블록 */
.slide-quote {
    background: var(--bg-card);
    border-left: 2px solid var(--accent);
    padding: 18px 22px; margin-bottom: 16px;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    color: var(--text-primary); font-size: 14px;
    line-height: 1.85; font-weight: 300;
}
.slide-quote strong {
    color: var(--gold); font-weight: 500;
}

/* 포인트 리스트 */
.slide-points {
    list-style: none; margin-bottom: 20px; padding-left: 0;
    display: flex; flex-direction: column; gap: 6px;
}
.slide-points li {
    position: relative;
    padding: 12px 16px 12px 36px;
    background: var(--bg-elevated);
    border-radius: var(--radius-sm);
    font-size: 13.5px; line-height: 1.7;
    color: var(--text-secondary); font-weight: 300;
    border: 1px solid var(--border-subtle);
    transition: var(--transition);
}
.slide-points li:hover {
    border-color: var(--border-accent);
    background: var(--bg-card);
}
.slide-points li::before {
    content: '';
    position: absolute; left: 15px; top: 50%;
    transform: translateY(-50%);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
}
.slide-points li strong {
    color: var(--gold); font-weight: 500;
}

/* 노트 블록 (aside) */
.slide-note {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--bg-elevated);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius);
    padding: 18px 20px; margin-top: 28px;
    position: relative; overflow: hidden;
}
.slide-note::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--gold), var(--accent));
    opacity: 0.5;
}
.note-icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }
.note-content {
    color: var(--text-secondary); font-size: 13px;
    line-height: 1.8; font-weight: 300;
}
.note-content strong { color: var(--text-primary); font-weight: 500; }

/* 이미지 */
.slide-image {
    margin-bottom: 20px; text-align: center;
}
.slide-image img {
    max-width: 100%; border-radius: var(--radius);
    border: 1px solid var(--border-dim);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

/* ========== 정의 카드 (> **제목** 본문 패턴) ========== */
.slide-def-card {
    background: var(--bg-card);
    border-left: 2px solid var(--accent);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 18px 22px;
    margin-bottom: 12px;
    transition: var(--transition);
}
.slide-def-card:hover {
    border-left-color: var(--gold);
    background: rgba(24,28,42,0.9);
}
.def-title {
    color: var(--gold); font-size: 14.5px; font-weight: 700;
    margin-bottom: 8px; letter-spacing: 0.2px;
}
.def-desc {
    color: var(--text-secondary); font-size: 13.5px;
    line-height: 1.8; font-weight: 300;
}
.def-desc strong { color: var(--text-primary); font-weight: 500; }

/* ========== 섹션 카드 (**볼드 헤더** + 본문) ========== */
.slide-card {
    background: var(--bg-elevated);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    margin-bottom: 10px;
    border: 1px solid var(--border-subtle);
    transition: var(--transition);
}
.slide-card:hover {
    border-color: var(--border-accent);
    transform: translateX(3px);
}
.card-heading {
    color: var(--gold); font-size: 14px; font-weight: 700;
    margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
}
.card-heading::before {
    content: ''; display: inline-block;
    width: 3px; height: 14px;
    background: var(--accent); border-radius: 2px;
    flex-shrink: 0;
}
.card-desc {
    color: var(--text-secondary); font-size: 13px;
    line-height: 1.8; font-weight: 300;
    padding-left: 11px;
}
.card-desc strong { color: var(--text-primary); font-weight: 500; }
.card-desc em { color: var(--accent-bright); font-style: normal; }

/* ========== 오디오 구간 맵 (재생바 아래 타임라인) ========== */
#audio-map {
    max-width: 860px; margin: 8px auto 0;
    height: 26px;
    display: flex;
    gap: 1px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--bg-elevated);
}
.map-segment {
    height: 100%;
    min-width: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: filter 0.15s;
    overflow: hidden;
    white-space: nowrap;
    padding: 0 2px;
}
.map-segment:hover {
    filter: brightness(1.3);
    z-index: 1;
}
.map-segment.active {
    filter: brightness(1.4);
    color: #fff;
    font-weight: 700;
}
/* 구간별 색상 (순서대로 순환) — gap 요소 제외 */
.map-segment:nth-of-type(odd)  { background: rgba(129,140,248,0.35); }
.map-segment:nth-of-type(even) { background: rgba(240,192,64,0.25); }
.map-gap {
    height: 100%;
    background: var(--bg-elevated);
}

/* ========== 메인 레이아웃 (콘텐츠 + 인덱스) ========== */
#main-layout {
    display: flex;
    max-width: 1200px;
    margin: 0 auto;
}
#slide-area {
    flex: 1;
    min-width: 0;
}
#slide-container {
    max-width: 800px; margin: 0 auto;
    padding: 40px 28px 80px;
}

/* ========== 인덱스 패널 (우측 사이드바) ========== */
#index-panel {
    width: 240px;
    flex-shrink: 0;
    border-left: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    position: sticky;
    top: 80px;
    height: calc(100vh - 80px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-dim) transparent;
}
#index-panel::-webkit-scrollbar { width: 4px; }
#index-panel::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }

#index-header {
    padding: 16px 16px 10px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
    border-bottom: 1px solid var(--border-subtle);
}

.index-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 16px;
    cursor: pointer;
    transition: var(--transition);
    border-left: 2px solid transparent;
    font-size: 12px;
    line-height: 1.5;
}
.index-item:hover {
    background: var(--bg-elevated);
    border-left-color: var(--border-accent);
}
.index-item.active {
    background: var(--bg-card);
    border-left-color: var(--accent);
}
.index-item .idx-id {
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    flex-shrink: 0;
    min-width: 28px;
}
.index-item .idx-title {
    color: var(--text-secondary);
    font-weight: 300;
}
.index-item.active .idx-title {
    color: var(--text-primary);
    font-weight: 400;
}
.index-item.has-audio .idx-id::after {
    content: ' ♪';
    color: var(--green);
    font-size: 8px;
}

/* ========== 반응형 ========== */
@media (max-width: 900px) {
    #index-panel { display: none; }
    #main-layout { display: block; }
    #audio-map { margin-top: 12px; }
}
@media (max-width: 640px) {
    /* 오디오 바 */
    #audio-bar { padding: 10px 12px; }
    #audio-map { margin-top: 16px; }
    #audio-controls { gap: 6px; }
    #play-btn { width: 36px; height: 36px; font-size: 14px; }
    .skip-btn { width: 30px; height: 30px; font-size: 11px; }
    #time-display { min-width: 70px; font-size: 10px; }
    #speed-select { padding: 4px 6px; font-size: 10px; }

    /* 네비게이션 도트: 가로 스크롤 */
    #slide-nav {
        flex-wrap: nowrap;
        justify-content: flex-start;
        padding: 8px 12px;
        gap: 2px;
    }
    .nav-dot { width: 28px; height: 26px; font-size: 9px; flex-shrink: 0; }

    /* 슬라이드 영역 */
    #slide-container { padding: 20px 14px 80px; }
    #slide-title { font-size: 20px; margin-bottom: 20px; padding-bottom: 14px; }
    #slide-header { gap: 8px; margin-bottom: 8px; }
    #slide-id { font-size: 10px; }
    #slide-badge { font-size: 9px; padding: 2px 8px; }

    /* 콘텐츠 블록 */
    .slide-text { font-size: 13.5px; line-height: 1.9; }
    .slide-card { padding: 16px; }
    .slide-def-card { padding: 14px; }
    .slide-note { padding: 14px 16px; font-size: 12.5px; }
    .slide-points li { font-size: 13.5px; }
    .slide-image img { max-height: 50vh; }

    /* 자막 바 */
    #subtitle-bar { padding: 10px 14px; }
    #subtitle-text { font-size: 0.9rem; }
}

/* 자막 바 */
#subtitle-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    padding: 14px 24px;
    background: rgba(0, 0, 0, 0.82);
    z-index: 1000;
    pointer-events: none;
    min-height: 24px;
}

#subtitle-text {
    color: #f0f0f0;
    font-size: 1.05rem;
    line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    transition: opacity 0.15s ease;
}

#subtitle-bar:empty,
#subtitle-bar:has(#subtitle-text:empty) {
    opacity: 0;
}
/* ========== 모바일 목차 FAB + 오버레이 ========== */
#index-fab {
    display: none;
    position: fixed;
    bottom: 76px; right: 20px;
    z-index: 1100;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--border-dim);
    background: var(--bg-elevated);
    color: var(--text-secondary);
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transition: var(--transition);
    align-items: center; justify-content: center;
}
#index-fab:hover {
    background: var(--accent);
    color: #fff;
    border-color: transparent;
}
@media (max-width: 900px) {
    #index-fab { display: flex; }
}

#index-overlay {
    display: none;
    position: fixed; inset: 0;
    z-index: 1200;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}
#index-overlay.open { display: flex; justify-content: flex-end; }

#index-overlay-panel {
    width: min(320px, 85vw);
    height: 100%;
    background: var(--bg-surface);
    border-left: 1px solid var(--border-subtle);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-dim) transparent;
    animation: slideInRight 0.25s ease-out;
}
@keyframes slideInRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
}
#index-overlay-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid var(--border-subtle);
}
#index-overlay-header span {
    font-size: 11px; font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
}
#index-overlay-close {
    background: transparent; border: none;
    color: var(--text-muted); font-size: 22px;
    cursor: pointer; padding: 4px 8px;
    border-radius: 6px;
    transition: var(--transition);
}
#index-overlay-close:hover {
    background: var(--bg-elevated); color: var(--text-primary);
}
#index-overlay-list .index-item {
    padding: 12px 16px;
}

</style>
</head>
<body>
<div id="app">
  <div id="audio-bar">
    <audio id="audio" src="상태와_시퀀스로_짜인_게임_캐릭터_설계도.m4a" preload="auto"></audio>
    <div id="audio-controls">
      <button class="skip-btn" onclick="skipTime(-10)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="2.5" height="12" rx="1" fill="currentColor"/><path d="M13 1.5L5 7L13 12.5V1.5Z" fill="currentColor"/></svg></button>
      <button id="play-btn" onclick="togglePlay()"><svg width="12" height="14" viewBox="0 0 12 14" fill="none"><path d="M1 1.5L11 7L1 12.5V1.5Z" fill="currentColor"/></svg></button>
      <button class="skip-btn" onclick="skipTime(10)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1.5L9 7L1 12.5V1.5Z" fill="currentColor"/><rect x="10.5" y="1" width="2.5" height="12" rx="1" fill="currentColor"/></svg></button>
      <span id="time-display">0:00 / 0:00</span>
      <input type="range" id="seek-bar" min="0" max="86400" value="0" step="0.1">
      <select id="speed-select" onchange="changeSpeed(this.value)">
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>

    "content": "<div class=\"slide-text\">대전 격투에서 캐릭터는 <strong>상황과 상태에 따라</strong> 애니메이션, 판정 범위, 데미지 등 수많은 요소가 변한다. 단순한  클래스 정의만으로는 이런 <strong>동적 규칙</strong>을 설명할 수 없기 때문에, 상태 다이어그램이 필수이다.</div>",

    "title": "상태 다이어그램",
    "content": "<div class=\"slide-card\"><div class=\"card-heading\">상태 다이어그램이란?</div></div>\n<ul class=\"slide-points\"><li>시간의 흐름에 따라 객체에 발생하는 변화를 모델링하는 수단</li><li>단일 객체를 대상으로 상태 변화를 추적</li><li>게임 캐릭터, UI, 시스템 등 다양한 곳에 활용 가능</li></ul>\n<div class=\"slide-card\"><div class=\"card-heading\">핵심 구성 요소</div></div>\n<div class=\"slide-card\"><div class=\"card-heading\">상태</div><div class=\"card-desc\">: 객체가 머무는 조건</div></div>\n<div class=\"slide-card\"><div class=\"card-heading\">전이</div><div class=\"card-desc\">: 상태 변화 및 조건</div></div>\n<div class=\"slide-card\"><div class=\"card-heading\">하위 상태</div><div class=\"card-desc\">: 상태 내부의 세부 단계</div></div>",

const TRANSCRIPT = [{"start": 0.0, "end": 1.68, "text": "여러분 환영합니다."}, {"start": 1.68, "end": 6.24, "text": "혹시 게임을 하시다가 몬스터가 막 벽에 머리를 계속 박고"}, {"start": 6.24, "end": 9.78, "text": "바보처럼 제자리 걸음하는 버그 본 적 있으시죠?"}, {"start": 9.78, "end": 13.3, "text": "네 저도 현업에 있지만 테스트할 때 정말 자주 보는 현상입니다."}, {"start": 13.3, "end": 14.18, "text": "그쵸."}, {"start": 14.18, "end": 17.78, "text": "우리는 보통 그걸 보고 캡쳐해서 우습고 넘기잖아요."}, {"start": 17.78, "end": 20.36, "text": "근데 사실 그 우습광서로운 순간이야말로"}, {"start": 20.36, "end": 25.46, "text": "오늘 우리가 파헤칠 게임 기획의 가장 핵심적인 비밀이 고장난 순간이라고 하더라고요."}, {"start": 25.46, "end": 27.78, "text": "맞습니다. 아주 정확한 지적이네요."}, {"start": 27.78, "end": 32.14, "text": "그래서 오늘 심충탄고에서는 게임 기획을 처음 배우는 분들을 위한"}, {"start": 32.14, "end": 35.42, "text": "아주 귀한 실전 가이드북을 하나 입수했습니다."}, {"start": 35.42, "end": 38.18, "text": "화멸 속 픽셀 덩어리에 불과한 캐릭터들에게"}, {"start": 38.18, "end": 41.42, "text": "도대체 어떻게 생명과 논리를 불어넣는지"}, {"start": 41.42, "end": 44.46, "text": "그 무대 뒤래의 기밀 문서를 해독해 볼 텐데요."}, {"start": 44.46, "end": 46.34, "text": "자, 이걸 한번 파헤쳐 볼까요?"}, {"start": 46.34, "end": 48.66, "text": "네. 많은 분들이 게임 기획이라고 하면"}, {"start": 48.66, "end": 52.52, "text": "그저 멋진 세계관을 짜거나 캐릭터의 화려한 외형을 상상하는"}, {"start": 52.52, "end": 54.900000000000006, "text": "스케치 작업 정도로만 생각하시곤 합니다."}, {"start": 54.9, "end": 58.18, "text": "사실 저도 어제까지는 약간 그렇게 생각했어요."}, {"start": 58.18, "end": 59.379999999999995, "text": "당연합니다."}, {"start": 59.379999999999995, "end": 62.379999999999995, "text": "하지만 실제 그 캐릭터가 유저의 조작에 반응하고"}, {"start": 62.379999999999995, "end": 64.74, "text": "화면 속에서 사람 움직이게 만들려면"}, {"start": 64.74, "end": 67.5, "text": "아주 정교한 건축적 설계도가 필요하거든요."}, {"start": 67.5, "end": 69.7, "text": "오늘 우리가 집중적으로 살펴볼 문건은"}, {"start": 69.7, "end": 72.7, "text": "바로 그 핵심 뼈대가 되는 다이어그램에 대한 내용입니다."}, {"start": 72.7, "end": 74.25999999999999, "text": "너무 기대됩니다."}, {"start": 74.25999999999999, "end": 78.02, "text": "저도 뼈 속까지 게이머라서 게임을 수천 시간은 해봤지만"}, {"start": 78.02, "end": 81.32, "text": "막상 이 캐릭터가 어떻게 내가 원하는 대로 움직이는지"}, {"start": 81.32, "end": 83.5, "text": "내부 원리는 전혀 몰랐거든요."}, {"start": 83.5, "end": 85.5, "text": "첫 번째 주제부터 바로 들어가 보죠."}, {"start": 85.5, "end": 86.7, "text": "좋습니다."}, {"start": 86.7, "end": 89.74, "text": "게임 속 모든 객체는 가만히 있거라 움직이는 등"}, {"start": 89.74, "end": 91.98, "text": "언제나 하나의 명확한 상태를 가집니다."}, {"start": 91.98, "end": 93.46000000000001, "text": "어, 잠깐만요."}, {"start": 93.46000000000001, "end": 95.46000000000001, "text": "그게 정확히 무슨 말이에요?"}, {"start": 95.46000000000001, "end": 97.9, "text": "캐릭터가 그냥 제가 조이스틱을 누르는 대로"}, {"start": 97.9, "end": 100.06, "text": "알아서 스르륵 움직이는 게 아니라는 건가요?"}, {"start": 100.06, "end": 101.18, "text": "음..."}, {"start": 101.18, "end": 104.3, "text": "겉보기에는 연속적인 흐름 같지만"}, {"start": 104.3, "end": 106.42, "text": "시스템은 그렇게 보지 않거든요."}, {"start": 106.42, "end": 109.3, "text": "캐릭터가 걷고, 뛰고, 공격하고"}, {"start": 109.3, "end": 111.74000000000001, "text": "심지어 죽는 모든 순간순간이"}, {"start": 111.74, "end": 115.33999999999999, "text": "시스템적으로는 하나하나 독립된 상태로 조각나서"}, {"start": 115.33999999999999, "end": 117.82, "text": "정의되어야만 게임이 돌아간다는 뜻입니다."}, {"start": 117.82, "end": 120.69999999999999, "text": "아, 걷는 거 따로, 뛰는 거 따로"}, {"start": 120.69999999999999, "end": 122.38, "text": "막 다 조각나 있다는 거군요?"}, {"start": 122.38, "end": 123.17999999999999, "text": "네, 맞습니다."}, {"start": 123.17999999999999, "end": 123.89999999999999, "text": "와..."}, {"start": 123.89999999999999, "end": 126.3, "text": "게임은 우리의 연속적인 행동을"}, {"start": 126.3, "end": 129.9, "text": "마치 스톡모션 사진처럼 끊어서 인식하는 거였네요."}, {"start": 129.9, "end": 132.29999999999998, "text": "그럼 이 상태라는 건 도대체 왜 필요하고"}, {"start": 132.29999999999998, "end": 133.9, "text": "어떻게 관리되는 건가요?"}, {"start": 133.9, "end": 136.7, "text": "단순한 데이터의 모음인 클래스만으로는"}, {"start": 136.7, "end": 140.57999999999998, "text": "캐릭터가 언제 어떤 행동을 할지 설명할 수 없기 때문에"}, {"start": 140.58, "end": 144.26000000000002, "text": "동적 규칙을 통제하는 상태 다이어그램이 반드시 필요합니다."}, {"start": 144.26000000000002, "end": 146.26000000000002, "text": "어, 그게 정합치 무슨 말이에요?"}, {"start": 146.26000000000002, "end": 150.02, "text": "약간 클래스라는 단어가 나오니까 갑자기 어려워지는데요?"}, {"start": 150.02, "end": 153.94, "text": "몬스터한테 체력이나 공격력 수치 같은 데이터만"}, {"start": 153.94, "end": 156.10000000000002, "text": "입력해주면 알아서 싸우는 거 아니었어요?"}, {"start": 156.10000000000002, "end": 158.98000000000002, "text": "이 문건에 나오는 고블린을 예로 한번 들어보죠."}, {"start": 158.98000000000002, "end": 159.94, "text": "네네, 고블린이요?"}, {"start": 159.94, "end": 162.06, "text": "고블린 클래스라는 상자 안에는"}, {"start": 162.06, "end": 165.38000000000002, "text": "HP나 공격력 같은 데이터는 담을 수 있습니다."}, {"start": 165.38000000000002, "end": 168.38000000000002, "text": "하지만 언제 플레이어에게 근접 공격을 하고"}, {"start": 168.38, "end": 171.18, "text": "언제 도망갈지를 결정하는 행동 규칙은"}, {"start": 171.18, "end": 173.9, "text": "상태 다이어그램이 있어야만 정의할 수 있습니다."}, {"start": 173.9, "end": 177.7, "text": "아, 단순 수치랑 행동하는 규칙은 아예 별개라는 거군요?"}, {"start": 177.7, "end": 178.54, "text": "그렇죠."}, {"start": 178.54, "end": 180.74, "text": "이걸 더 큰 그림과 연결해보면"}, {"start": 180.74, "end": 183.01999999999998, "text": "대전 격투 게임처럼 상황에 따라"}, {"start": 183.01999999999998, "end": 185.85999999999999, "text": "판정이 시시각각 변하는 복잡한 게임일수록"}, {"start": 185.85999999999999, "end": 187.42, "text": "이 다이어그램이 필수적입니다."}, {"start": 187.42, "end": 189.7, "text": "오, 단순한 숫자 데이터가 아니라"}, {"start": 189.7, "end": 192.98, "text": "캐릭터한테 일종의 지능을 부여하는 거네요."}, {"start": 192.98, "end": 194.94, "text": "자, 여기서 정말 흥미로운 점인데"}, {"start": 194.94, "end": 196.85999999999999, "text": "그럼 이 상태 다이어그램이라는 건"}, {"start": 196.9, "end": 199.22000000000003, "text": "구체적으로 어떤 요소들로 구성되는 건가요?"}, {"start": 199.22000000000003, "end": 202.10000000000002, "text": "상태 다이어그램은 특정 조건에 따라"}, {"start": 202.10000000000002, "end": 204.5, "text": "단일 객체 내부에서 일어나는 변화를"}, {"start": 204.5, "end": 208.82000000000002, "text": "상태, 전이, 하위상태라는 핵심 요소로 기록하는 도구입니다."}, {"start": 208.82000000000002, "end": 210.9, "text": "그게 정확히 무슨 말이에요?"}, {"start": 210.9, "end": 213.06, "text": "전이니, 하위상태니..."}, {"start": 213.06, "end": 216.42000000000002, "text": "그러니까 어떤 상태에 진입할 때랑 유지할 때"}, {"start": 216.42000000000002, "end": 218.62, "text": "무언가 다른 일이 벌어진다는 건가요?"}, {"start": 218.62, "end": 221.70000000000002, "text": "이해하기 쉽게 자룡에 나온 사망상태를 볼까요?"}, {"start": 221.70000000000002, "end": 223.26000000000002, "text": "으악! 하고 죽는 거요?"}, {"start": 223.26000000000002, "end": 224.62, "text": "네, 맞습니다."}, {"start": 224.62, "end": 226.34, "text": "캐릭터가 사망상태에 진입"}, {"start": 226.38, "end": 230.9, "text": "즉 엔트리하면 가장 먼저 시스템은 HP를 0으로 고정합니다."}, {"start": 230.9, "end": 233.82, "text": "아, 들어가자마자 P를 0으로 만드는군요."}, {"start": 233.82, "end": 236.98000000000002, "text": "그리고 그 상태를 유지하는 두 단계 동안에는"}, {"start": 236.98000000000002, "end": 239.9, "text": "화면이 흑백으로 변하며 경험치가 깎이게 되죠."}, {"start": 239.9, "end": 244.5, "text": "아, 리스폰 대기할 때 화면 회색으로 변하는 게 유지 단계구나."}, {"start": 244.5, "end": 245.82, "text": "네, 정확합니다."}, {"start": 245.82, "end": 249.42000000000002, "text": "그리고 마지막으로 상태를 탈출하는 엑시트 단계에서는"}, {"start": 249.42000000000002, "end": 253.5, "text": "부활 방법을 선택하는 창이 뜨는 식으로 아주 세밀하게 쪼개져 있습니다."}, {"start": 253.5, "end": 256.02, "text": "와, 여러분 이거 진짜 대박이지 않나요?"}, {"start": 256.02, "end": 259.74, "text": "죽는 찰나의 순간조차도 진입, 유지, 탈출"}, {"start": 259.74, "end": 262.53999999999996, "text": "이렇게 세 단계로 나뉘어 기획되는 거였네요."}, {"start": 262.53999999999996, "end": 265.62, "text": "그럼 하나의 상태에서 임무를 다 마치면"}, {"start": 265.62, "end": 267.94, "text": "다음 상태로는 어떻게 넘어가는 건가요?"}, {"start": 267.94, "end": 271.82, "text": "조건이 충족되면 진입포인트와 탈출포인트를 거쳐"}, {"start": 271.82, "end": 274.46, "text": "다른 상태로 넘어가는 전이가 일어나며"}, {"start": 274.46, "end": 278.21999999999997, "text": "하나의 큰 상태 안에는 더 세밀한 하위 상태들이 존재합니다."}, {"start": 278.21999999999997, "end": 280.62, "text": "어, 그게 정확히 무슨 말이에요?"}, {"start": 280.62, "end": 284.29999999999995, "text": "상태 안에 또 다른 작은 상태들이 숨어 있고"}, {"start": 284.3, "end": 288.46000000000004, "text": "거기로 전이 된다는 게 막 머릿속에 잘 안 그려지는데요."}, {"start": 288.46000000000004, "end": 290.18, "text": "마트료 시카 인형 같은 건가요?"}, {"start": 290.18, "end": 294.54, "text": "여기서 매력적인 부분은 문권에 아주 재밌는 비유가 나온다는 겁니다."}, {"start": 294.54, "end": 296.82, "text": "라면을 끓이는 조리 상태를 한번 생각해 보세요."}, {"start": 296.82, "end": 298.62, "text": "오, 라면. 좋죠."}, {"start": 298.62, "end": 303.34000000000003, "text": "그 조리 라는 큰 상태 안에는 먼저 물을 끓이는 하위 상태를 거쳐"}, {"start": 303.34000000000003, "end": 307.46000000000004, "text": "면을 넣는 하위 상태로 전이 되는 아주 세부적인 흐름이 포함되어 있습니다."}, {"start": 307.46000000000004, "end": 310.86, "text": "아, 라면 비유를 들으니까 확 와닿네요."}, {"start": 310.86, "end": 315.06, "text": "큰 폴더 안에 작은 폴더들이 순서대로 쫘르르 있는 느낌이에요."}, {"start": 315.06, "end": 318.5, "text": "물이 안 끓었는데 면부터 넣으면 버그가 나는 거잖아요?"}, {"start": 318.5, "end": 320.94, "text": "그렇죠. 시스템에 에러가 생기는 거죠."}, {"start": 320.94, "end": 323.42, "text": "그럼 이렇게 내부적으로 상태가 전이 될 때"}, {"start": 323.42, "end": 326.02000000000004, "text": "플레이어는 그걸 어떻게 알아채는 건가요?"}, {"start": 326.02000000000004, "end": 327.82, "text": "우리가 코드를 볼 순 없잖아요."}, {"start": 327.82, "end": 329.74, "text": "게임 내부에서 상태가 전이 될 때는"}, {"start": 329.74, "end": 331.74, "text": "플레이어가 직관적으로 알아칠 수 있도록"}, {"start": 331.74, "end": 335.98, "text": "반드시 애니메이션 전환이나 이펙트 같은 비주얼 피드백이 동반됩니다."}, {"start": 335.98, "end": 337.62, "text": "그게 정확히 무슨 말이에요?"}, {"start": 337.62, "end": 339.58000000000004, "text": "코드만 띡 바뀌는 게 아니라"}, {"start": 339.58, "end": 342.58, "text": "눈에 보이는 장치가 연결되어 있어야 한다는 뜻인가요?"}, {"start": 342.58, "end": 344.9, "text": "네. 대기하던 캐릭터가 뛰고"}, {"start": 344.9, "end": 347.7, "text": "이어서 공격하는 각 상태로 전이 될 때마다"}, {"start": 347.7, "end": 350.02, "text": "걷는 모션이 뛰는 모션으로 바뀌고"}, {"start": 350.02, "end": 351.53999999999996, "text": "칼바람 소리가 나게 됩니다."}, {"start": 351.53999999999996, "end": 354.38, "text": "아, 그 칼 휘두를 때 슉슉 나는 소리요?"}, {"start": 354.38, "end": 356.94, "text": "그게 다 상태가 넘어갔다는 신호였군요?"}, {"start": 356.94, "end": 361.18, "text": "맞습니다. 참고로 이런 캐릭터의 걷고 뛰는 기본 상태는"}, {"start": 361.18, "end": 364.9, "text": "독에 걸리는 상태 이상과는 완전히 다르게 취급해야 한다는 점이"}, {"start": 364.9, "end": 366.74, "text": "현옵의 중요한 팁입니다."}, {"start": 366.74, "end": 368.82, "text": "두 개가 속기면 게임이 엉망이 되거든요."}, {"start": 368.82, "end": 373.34, "text": "아, 걷는 거랑 독 걸린 건 아예 별개의 트랙이라는 거네요."}, {"start": 373.34, "end": 377.78, "text": "내 캐릭터 혼자서 어떻게 행동하고 움직이는지는 이제 완벽히 이해했어요."}, {"start": 377.78, "end": 380.38, "text": "그럼 내 캐릭터가 다른 몬스터나"}, {"start": 380.38, "end": 383.74, "text": "뭐 학교 같은 거대한 시스템과 상호작용할 때"}, {"start": 383.74, "end": 386.82, "text": "이 혼자만의 다이어그램만으로 부족하지 않나요?"}, {"start": 386.82, "end": 388.18, "text": "그럼 어떻게 되는 건가요?"}, {"start": 388.18, "end": 389.42, "text": "아주 좋은 포인트입니다."}, {"start": 389.42, "end": 392.21999999999997, "text": "상태 다이어그램이 단일 객체 내부대나라면"}, {"start": 392.21999999999997, "end": 396.14, "text": "여러 객체가 시간에 따라 순서대로 어떤 메시지를 주고받는지"}, {"start": 396.18, "end": 399.41999999999996, "text": "상호작용을 시각화하는 것이 바로 시퀀스 다이어그램입니다."}, {"start": 399.41999999999996, "end": 401.3, "text": "어, 그게 정확히 무슨 말이에요?"}, {"start": 401.3, "end": 404.46, "text": "방금 전까지 배운 상태 다이어그램이랑 시퀀스 다이어그램이"}, {"start": 404.46, "end": 407.3, "text": "구체적으로 어떤 차이가 있는 건지 살짝 헷갈려요."}, {"start": 407.3, "end": 410.78, "text": "쉽게 말해 상태 다이어그램이 고블린 혼자만의 일기장이라면"}, {"start": 410.78, "end": 413.06, "text": "네네, 일기장."}, {"start": 413.06, "end": 416.06, "text": "시퀀스 다이어그램은 단일 신 안에서"}, {"start": 416.06, "end": 419.62, "text": "여러 참여자가 주고받는 대화록입니다."}, {"start": 419.62, "end": 424.18, "text": "문권의 예시를 보면 학생이라는 주체와 학교라는 시스템"}, {"start": 424.18, "end": 427.78000000000003, "text": "이 두 객체 사이에서 등교와 학요라는 메시지가"}, {"start": 427.78000000000003, "end": 430.54, "text": "시간순으로 어떻게 오가는지를 기록한 것이죠."}, {"start": 430.54, "end": 434.78000000000003, "text": "아, 무대에 여러 명의 배우가 동시에 등장하는 거군요."}, {"start": 434.78000000000003, "end": 437.02, "text": "나 혼자만의 일기장에서"}, {"start": 437.02, "end": 440.5, "text": "남들과의 카톡방으로 스케일이 커진 느낌이네요."}, {"start": 440.5, "end": 444.06, "text": "그럼 이 시퀀스 다이어그램은 구체적으로 어떻게 그려지고"}, {"start": 444.06, "end": 446.18, "text": "메시지는 어떻게 전달되는 건가요?"}, {"start": 446.18, "end": 449.7, "text": "객체의 존재를 나타내는 점선인 생명선 위에서"}, {"start": 449.7, "end": 452.14, "text": "특정 구간 동안 실행 상태가 되어"}, {"start": 452.14, "end": 456.18, "text": "동기메세지나 답신 메시지 등을 화살표로 주고받는 구조입니다."}, {"start": 456.18, "end": 458.86, "text": "어, 잠깐만요. 그게 정확히 무슨 말이에요?"}, {"start": 458.86, "end": 461.53999999999996, "text": "동기메세지니 답신이니 하는 영어들이 나오니까"}, {"start": 461.53999999999996, "end": 463.74, "text": "갑자기 너무 전문적인 느낌이 드는데요?"}, {"start": 463.74, "end": 465.34, "text": "전혀 어렵지 않습니다."}, {"start": 465.34, "end": 468.21999999999997, "text": "학생이 학교 측에 저 등교했습니다. 라고"}, {"start": 468.21999999999997, "end": 471.3, "text": "일반적인 메시지를 보내면 이게 실선 화살표구요."}, {"start": 471.3, "end": 472.02, "text": "네."}, {"start": 472.02, "end": 475.18, "text": "시스미 일을 처리하고 등교철이 완료되었습니다."}, {"start": 475.18, "end": 477.14, "text": "라고 응답을 돌려주는 것이 바로"}, {"start": 477.14, "end": 479.02, "text": "점선 화살표인 답신 메시지입니다."}, {"start": 479.02, "end": 481.97999999999996, "text": "와, 카카오톡에서 메시지 보내고 답장 받는 거랑"}, {"start": 482.02000000000004, "end": 483.02000000000004, "text": "그냥 똑같네요."}, {"start": 483.02000000000004, "end": 485.26, "text": "네. 그 원리와 완전히 동일합니다."}, {"start": 485.26, "end": 488.42, "text": "근데 게임에서는 단순히 말만 주고받는 게 아니라"}, {"start": 488.42, "end": 491.14000000000004, "text": "전투 중에 유닛이 새로 만들어지거나"}, {"start": 491.14000000000004, "end": 493.1, "text": "건물이 부서지기도 하잖아요."}, {"start": 493.1, "end": 495.78000000000003, "text": "그런 엄청 복잡한 상황은 어떻게 되는 건가요?"}, {"start": 495.78000000000003, "end": 498.90000000000003, "text": "자원의 양 같은 조건에 따른 분기를 설정하고"}, {"start": 498.90000000000003, "end": 503.34000000000003, "text": "그 조건을 만족했을 때 완전히 새로운 객체가 생성되는 역동적인 과정을"}, {"start": 503.34000000000003, "end": 505.74, "text": "동일한 씬 안에서 완벽하게 표현할 수 있습니다."}, {"start": 505.74, "end": 507.66, "text": "어, 그게 정확히 무슨 말이에요?"}, {"start": 507.66, "end": 510.14000000000004, "text": "분기 조건이랑 새로운 유닛 생성을"}, {"start": 510.14, "end": 512.9, "text": "그 다이어그램 하나에 한 번에 다 담을 수 있다는 건가요?"}, {"start": 512.9, "end": 514.38, "text": "좀 터질 것 같은데요?"}, {"start": 514.38, "end": 516.5, "text": "문건의 스타크래프트 해병"}, {"start": 516.5, "end": 520.6999999999999, "text": "즉, 마린 생산 과정을 생각하면 완벽합니다."}, {"start": 520.6999999999999, "end": 525.3, "text": "플레이어가 보유한 광물이 해병 가격보다 많다는 분기 조건이 만족되면"}, {"start": 525.3, "end": 527.78, "text": "아, 미네랄 50원 있는지 확인하는 거요?"}, {"start": 527.78, "end": 529.1, "text": "네, 맞습니다."}, {"start": 529.1, "end": 533.46, "text": "그 조건이 맞으면 대기 중이던 건물의 상태가 생산 중으로 변하고"}, {"start": 533.46, "end": 536.7, "text": "15초 뒤에 드디어 해병이라는 새로운 객체가"}, {"start": 536.7, "end": 540.94, "text": "짠 하고 생성되는 흐름 전체가 이 다이어그램 하나로 증명되는 거죠."}, {"start": 540.94, "end": 542.5400000000001, "text": "와, 대박이다."}, {"start": 542.5400000000001, "end": 547.7800000000001, "text": "전토 한 판이나 유닛 생산 사이클 전체가 화살표 몇 개로 한눈에 쫙 들어오겠네요."}, {"start": 547.7800000000001, "end": 549.6600000000001, "text": "그럼 이게 다 무슨 의미일까요?"}, {"start": 549.6600000000001, "end": 553.6600000000001, "text": "오늘 살펴본 이 기획 문서들이 우리에게 어떤 시사점을 주나요?"}, {"start": 553.6600000000001, "end": 555.82, "text": "오늘 살펴본 내용을 정리해보죠."}, {"start": 555.82, "end": 558.82, "text": "기획이란 그저 예쁜 그림을 그리는 게 아니라"}, {"start": 558.82, "end": 563.34, "text": "상태와 시퀀스라는 철저하고 논리적인 시스템을 설계하는 건축 작업입니다."}, {"start": 563.34, "end": 564.26, "text": "맞아요."}, {"start": 564.26, "end": 569.18, "text": "원인과 결과, 조건과 반응이라는 톱니바퀴시계를 조립하는 거나 다름 없네요."}, {"start": 569.18, "end": 573.5, "text": "그리고 정보의 홍수 속에서 이렇게 구조화된 논리적 사고는"}, {"start": 573.5, "end": 578.22, "text": "게임뿐만 아니라 현실의 복잡한 시스템을 이해하는 데에도 큰 도움이 됩니다."}, {"start": 578.22, "end": 580.9399999999999, "text": "여기서 있는 아주 중요한 논점을 제시합니다."}, {"start": 580.9399999999999, "end": 582.26, "text": "어떤 논점인가요?"}, {"start": 582.26, "end": 587.62, "text": "오늘 우리는 철저하게 기획자의 통제하에 움직이는 다이어그램을 보았습니다."}, {"start": 587.62, "end": 591.38, "text": "하지만 최근 AI와 머신러닝이 게임에 도입되면서"}, {"start": 591.38, "end": 597.02, "text": "이처럼 모든 조건을 기획자가 미리 쪼개어 정의하는 전통적인 결정론적 설계 방식이"}, {"start": 597.02, "end": 600.1, "text": "과연 언제까지 유효할지 생각해볼 필요가 있습니다."}, {"start": 600.1, "end": 601.66, "text": "어, 듣고 보니 그러네요."}, {"start": 601.66, "end": 607.46, "text": "캐릭터가 수많은 데이터를 바탕으로 스스로 상태와 시퀀스를 학습하고 만들어내는 시대가 오면"}, {"start": 607.46, "end": 610.7, "text": "게임 기획의 의미 자체가 완전히 뒤바뀔지도 모릅니다."}, {"start": 610.7, "end": 613.3, "text": "와, 약간 소름돋았어요."}, {"start": 613.3, "end": 617.78, "text": "기획자가 안정해졌는데 캐릭터가 스스로 상태를 창조한다니"}, {"start": 617.78, "end": 620.34, "text": "진짜 경이롭네요."}, {"start": 620.34, "end": 626.38, "text": "여러분, 오늘 이 심증 탐구를 통해서 아무 생각 없이 누르던 스케일 버튼 하나가"}, {"start": 626.38, "end": 631.86, "text": "얼마나 치밀하고 아름다운 논리 위에서 작동하는지 느끼셨기를 바랍니다."}, {"start": 631.86, "end": 637.46, "text": "여러분이 사랑하는 게임의 그 위대한 무대 뒷현을 한번쯤 상상하며 플레이 해보시면"}, {"start": 637.46, "end": 639.74, "text": "더 재미있게 즐기실 수 있을 겁니다."}];

let lastSubIdx = -1;
const audio = document.getElementById('audio');
const playBtn = document.getElementById('play-btn');
const ICON_PLAY  = '<svg width="12" height="14" viewBox="0 0 12 14" fill="none"><path d="M1 1.5L11 7L1 12.5V1.5Z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg width="12" height="14" viewBox="0 0 12 14" fill="none"><rect x="1" y="1" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="7.5" y="1" width="3.5" height="12" rx="1" fill="currentColor"/></svg>';
const timeDisplay = document.getElementById('time-display');
const seekBar = document.getElementById('seek-bar');

// 오디오 포함 슬라이드를 시작시간 순으로 정렬한 인덱스 (동기화용)
const audioSlides = SLIDES
    .map((s, i) => ({idx: i, start: s.start, end: s.end, hasAudio: s.hasAudio}))
    .filter(s => s.hasAudio && s.start !== null)
    .sort((a, b) => a.start - b.start);

function init() {
    buildNav();
    buildIndex();
    buildAudioMap();
    showSlide(0);
    audio.addEventListener('timeupdate', onTimeUpdate);
    // 오디오 메타데이터 로드 시 시크바 max 갱신
    audio.addEventListener('loadedmetadata', updateSeekBarMax);
    audio.addEventListener('durationchange', updateSeekBarMax);
    // canplay 이벤트도 대비 (일부 브라우저/포맷에서 loadedmetadata가 늦게 발생)
    audio.addEventListener('canplay', updateSeekBarMax);
    // 슬라이더 드래그 시: 오디오 위치 이동 + 즉시 슬라이드 동기화
    seekBar.addEventListener('input', () => {
        audio.currentTime = seekBar.value;
        isAutoSync = true;
        syncSlideToTime(audio.currentTime);
        updateSubtitle(audio.currentTime);
    });
    // 일시정지 상태에서 seek 완료 시에도 슬라이드 동기화
    audio.addEventListener('seeked', () => {
        syncSlideToTime(audio.currentTime);
        updateTimeDisplay();
        updateSubtitle(audio.currentTime);
    });
}

function updateSeekBarMax() {
    if (audio.duration && isFinite(audio.duration)) {
        seekBar.max = audio.duration;
        updateTimeDisplay();
    }
}

function buildNav() {
    const nav = document.getElementById('slide-nav');
    SLIDES.forEach((slide, i) => {
        const dot = document.createElement('button');
        dot.className = 'nav-dot ' + (slide.hasAudio ? 'has-audio' : 'no-audio');
        dot.textContent = slide.id.replace('P', '');
        dot.title = slide.id + ' — ' + slide.title;
        dot.onclick = () => { isAutoSync = false; showSlide(i); };
        nav.appendChild(dot);
    });
}

function buildIndex() {
    const list = document.getElementById('index-list');
    SLIDES.forEach((slide, i) => {
        const item = document.createElement('div');
        item.className = 'index-item' + (slide.hasAudio ? ' has-audio' : '');
        item.innerHTML = '<span class="idx-id">' + slide.id + '</span><span class="idx-title">' + slide.title + '</span>';
        item.onclick = () => { isAutoSync = false; showSlide(i); };
        list.appendChild(item);
    });
}

function buildAudioMap() {
    const map = document.getElementById('audio-map');
    if (!map) return;
    let prevEnd = 0;
    audioSlides.forEach((s, i) => {
        const slide = SLIDES[s.idx];
        const duration = s.end - s.start;
        // 시간 갭이 있으면 빈 공간 삽입
        if (s.start > prevEnd + 1) {
            const gap = document.createElement('div');
            gap.className = 'map-gap';
            gap.style.flexGrow = (s.start - prevEnd).toFixed(1);
            map.appendChild(gap);
        }
        const seg = document.createElement('div');
        seg.className = 'map-segment';
        seg.dataset.idx = s.idx;
        seg.style.flexGrow = duration.toFixed(1);
        seg.textContent = slide.id;
        seg.title = slide.id + ' — ' + slide.title;
        seg.onclick = () => {
            audio.currentTime = s.start;
            isAutoSync = true;
            syncSlideToTime(s.start);
        };
        map.appendChild(seg);
        prevEnd = s.end;
    });
}

function updateAudioMap(currentIdx) {
    document.querySelectorAll('.map-segment').forEach(seg => {
        seg.classList.toggle('active', parseInt(seg.dataset.idx) === currentIdx);
    });
}

function showSlide(index) {
    if (index < 0 || index >= SLIDES.length) return;
    currentSlide = index;
    const slide = SLIDES[index];
    document.getElementById('slide-id').textContent = slide.id;
    document.getElementById('slide-title').textContent = slide.title;
    const contentEl = document.getElementById('slide-content');
    contentEl.style.animation = 'none';
    contentEl.offsetHeight; // 리플로우 트리거
    contentEl.style.animation = '';
    contentEl.innerHTML = slide.content;
    const badge = document.getElementById('slide-badge');
    if (slide.hasAudio) {
        badge.textContent = '🎵 오디오 포함';
        badge.className = 'badge-audio';
    } else {
        badge.textContent = '📖 교안 전용';
        badge.className = 'badge-no-audio';
    }
    // 네비게이션 도트 활성화
    document.querySelectorAll('.nav-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
    });
    // 인덱스 패널 활성화
    document.querySelectorAll('.index-item').forEach((item, i) => {
        item.classList.toggle('active', i === index);
        if (i === index) item.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    });
    // 오디오 맵 활성화
    updateAudioMap(index);

    window.scrollTo({top: 0, behavior: 'smooth'});
}

// 시간 기반 슬라이드 동기화 (정렬된 audioSlides 사용)
function syncSlideToTime(t) {
    let targetIdx = -1;
    for (let i = audioSlides.length - 1; i >= 0; i--) {
        if (t >= audioSlides[i].start) {
            targetIdx = audioSlides[i].idx;
            break;
        }
    }
    if (targetIdx >= 0 && targetIdx !== currentSlide) {
        showSlide(targetIdx);
    }
}

function onTimeUpdate() {
    const t = audio.currentTime;
    seekBar.value = t;
    updateTimeDisplay();
    updateSubtitle(t);
    if (!isAutoSync) return;
    syncSlideToTime(t);
}

function updateTimeDisplay() {
    const cur = formatTime(audio.currentTime);
    const dur = formatTime(audio.duration || 0);
    timeDisplay.textContent = cur + ' / ' + dur;
}

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
}

function togglePlay() {
    if (audio.paused) {
        audio.play();
        playBtn.innerHTML = ICON_PAUSE;
        isAutoSync = true;
    } else {
        audio.pause();
        playBtn.innerHTML = ICON_PLAY;
    }
}

function changeSpeed(val) {
    audio.playbackRate = parseFloat(val);
}

function skipTime(sec) {
    audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + sec));
}

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowLeft') { showSlide(currentSlide - 1); isAutoSync = false; }
    if (e.code === 'ArrowRight') { showSlide(currentSlide + 1); isAutoSync = false; }
});

function updateSubtitle(t) {
    if (typeof TRANSCRIPT === 'undefined' || TRANSCRIPT.length === 0) return;
    const idx = findTranscriptIdx(t);
    if (idx === lastSubIdx) return;
    lastSubIdx = idx;
    const el = document.getElementById('subtitle-text');
    if (el) el.textContent = idx >= 0 ? TRANSCRIPT[idx].text : '';
}

function findTranscriptIdx(t) {
    let lo = 0, hi = TRANSCRIPT.length - 1, result = -1;
    while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (TRANSCRIPT[mid].start <= t) { result = mid; lo = mid + 1; }
        else { hi = mid - 1; }
    }
    if (result >= 0 && t <= TRANSCRIPT[result].end) return result;
    return -1;
}

init();
// 모바일 목차 오버레이
function buildOverlayIndex() {
    const list = document.getElementById('index-overlay-list');
    if (!list) return;
    SLIDES.forEach((slide, i) => {
        const item = document.createElement('div');
        item.className = 'index-item' + (slide.hasAudio ? ' has-audio' : '');
        item.innerHTML = '<span class="idx-id">' + slide.id + '</span><span class="idx-title">' + slide.title + '</span>';
        item.onclick = () => { isAutoSync = false; showSlide(i); closeOverlay(); };
        list.appendChild(item);
    });
}

function openOverlay() {
    const ov = document.getElementById('index-overlay');
    ov.classList.add('open');
    const items = document.querySelectorAll('#index-overlay-list .index-item');
    items.forEach((item, i) => {
        item.classList.toggle('active', i === currentSlide);
        if (i === currentSlide) item.scrollIntoView({block: 'center', behavior: 'smooth'});
    });
}

function closeOverlay() {
    document.getElementById('index-overlay').classList.remove('open');
}

buildOverlayIndex();

</script>
</body>
</html>
